spring:
  application:
    name: sentinel-agentops
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:sentinel-agentops-assessments}
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 3
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

sentinel:
  kafka:
    topics:
      assessments: sentinel.agents.assessments
      assessments-dlt: sentinel.agents.assessments.DLT
      partitions: 6
      replication-factor: 1
    listener:
      concurrency: ${KAFKA_CONCURRENCY:8}
    retry:
      attempts: 4
      delay: 250ms
      multiplier: 2.0
      max-delay: 5s
      auto-create-topics: true
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:http://localhost:8081}
    key: ${COSMOS_KEY:}
    database: ${COSMOS_DATABASE:sentinel-agentops}
    container: ${COSMOS_CONTAINER:agent-assessments}
    request-timeout: 10s
    connect-timeout: 5s
    idle-connection-timeout: 30s
    idle-endpoint-timeout: 60s
    max-connections-per-endpoint: 500
    max-requests-per-connection: 50

microsoft:
  iq:
    foundry:
      endpoint: ${MICROSOFT_IQ_FOUNDRY_ENDPOINT:https://api.foundry.microsoft.com/v1}
      api-key: ${MICROSOFT_IQ_FOUNDRY_API_KEY:mock-key}