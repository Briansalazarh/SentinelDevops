spring:
  application:
    name: sentinel-agentops
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:sentinel-agentops-assessments}
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:5}
      properties:
        max.in.flight.requests.per.connection: ${KAFKA_PRODUCER_MAX_IN_FLIGHT:5}
        enable.idempotence: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

sentinel:
  kafka:
    topics:
      assessments: ${SENTINEL_KAFKA_TOPIC_ASSESSMENTS:sentinel.agents.assessments}
      assessments-dlt: ${SENTINEL_KAFKA_TOPIC_DLT:sentinel.agents.assessments.DLT}
      partitions: ${SENTINEL_KAFKA_PARTITIONS:6}
      replication-factor: ${SENTINEL_KAFKA_REPLICATION_FACTOR:1}
    listener:
      concurrency: ${KAFKA_CONCURRENCY:8}
    retry:
      attempts: 4
      delay: 250ms
      multiplier: 2.0
      max-delay: 5s
      auto-create-topics: true
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:http://localhost:8081}
    key: ${COSMOS_KEY:C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+wtQUy4AQMQ9hfhE5D/6xf8q8ijA==}
    database: ${COSMOS_DATABASE:sentinel-agentops}
    container: ${COSMOS_CONTAINER:agent-assessments}
    request-timeout: ${COSMOS_REQUEST_TIMEOUT:10s}
    connect-timeout: ${COSMOS_CONNECT_TIMEOUT:5s}
    idle-connection-timeout: ${COSMOS_IDLE_CONN_TIMEOUT:30s}
    idle-endpoint-timeout: ${COSMOS_IDLE_ENDPOINT_TIMEOUT:60s}
    max-connections-per-endpoint: ${COSMOS_MAX_CONNECTIONS:500}
    max-requests-per-connection: ${COSMOS_MAX_REQUESTS:50}

microsoft:
  iq:
    foundry:
      endpoint: ${MICROSOFT_IQ_FOUNDRY_ENDPOINT:https://api.foundry.microsoft.com/v1}
      api-key: ${MICROSOFT_IQ_FOUNDRY_API_KEY:mock-key}
